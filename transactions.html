<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Últimos Movimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="bg-primary min-vh-100 d-flex align-items-center justify-content-center p-3">
        <div class="card shadow-lg border-0 rounded-4" style="max-width: 550px; width: 100%;">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center fw-bold mb-4">Últimos Movimientos</h2>

                <!-- Saldo -->
                <div class="bg-light rounded-3 p-3 mb-4 text-center">
                    <small class="text-muted">Saldo actual</small>
                    <h4 class="fw-bold text-success mb-0" id="currentBalance">$5,250.00</h4>
                </div>

                <!-- Filtros -->
                <div class="mb-3">
                    <button class="btn btn-outline-primary btn-sm filter-btn active" data-filter="all">Todos</button>
                    <button class="btn btn-outline-success btn-sm filter-btn" data-filter="deposit">Depósitos</button>
                    <button class="btn btn-outline-danger btn-sm filter-btn" data-filter="send">Envíos</button>
                </div>

                <!-- Lista de movimientos -->
                <div id="transactionsList" style="max-height: 300px; overflow-y: auto;"></div>

                <div id="emptyMessage" class="text-center text-muted py-4 d-none">
                    No hay movimientos registrados
                </div>

                <hr class="my-4">
                <button class="btn btn-outline-secondary w-100" onclick="window.location.href='menu.html'">Volver al Menú</button>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS personalizado -->
    <script src="assets/js/transactions.js"></script>
</body>
</html>
