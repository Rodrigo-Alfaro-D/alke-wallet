<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Enviar Dinero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="bg-primary min-vh-100 d-flex align-items-center justify-content-center p-3">
        <div class="card shadow-lg border-0 rounded-4" style="max-width: 500px; width: 100%;">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center fw-bold mb-4">Enviar Dinero</h2>

                <!-- Saldo -->
                <div class="bg-light rounded-3 p-3 mb-4 text-center">
                    <small class="text-muted">Saldo actual</small>
                    <h4 class="fw-bold text-success mb-0" id="currentBalance">$5,250.00</h4>
                </div>

                <!-- Buscador -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Buscar contacto</label>
                    <input type="text" class="form-control" id="searchContact" placeholder="Nombre o Alias...">
                </div>

                <!-- Lista de contactos -->
                <div id="contactList" class="mb-3" style="max-height: 200px; overflow-y: auto;"></div>

                <!-- Botón agregar contacto -->
                <button class="btn btn-outline-primary w-100 mb-3" data-bs-toggle="modal" data-bs-target="#addContactModal">
                    + Agregar nuevo contacto
                </button>

                <!-- Área de transferencia -->
                <div id="transferArea" class="d-none bg-light rounded-3 p-3">
                    <p class="mb-2">Enviar a: <strong id="transferTarget"></strong></p>
                    <div class="input-group mb-2">
                        <span class="input-group-text">$</span>
                        <input type="number" class="form-control" id="transferAmount" placeholder="Monto" min="0.01" step="0.01">
                    </div>
                    <button class="btn btn-success w-100" id="sendTransferBtn">Enviar</button>
                </div>

                <hr class="my-4">
                <button class="btn btn-outline-secondary w-100" onclick="window.location.href='menu.html'">Volver al Menú</button>
            </div>
        </div>
    </div>

    <!-- Modal Agregar Contacto -->
    <div class="modal fade" id="addContactModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nuevo Contacto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nombre y apellido</label>
                        <input type="text" class="form-control" id="contactName" placeholder="Ej: Juan Pérez">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">CBU</label>
                        <input type="text" class="form-control" id="contactCbu" placeholder="Ej: 1234567890123456789012">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Alias</label>
                        <input type="text" class="form-control" id="contactAlias" placeholder="Ej: juan.perez">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre del Banco</label>
                        <input type="text" class="form-control" id="contactBank" placeholder="Ej: Banco Nación">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="saveContactBtn">Guardar contacto</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS personalizado -->
    <script src="assets/js/sendmoney.js"></script>
</body>
</html>
