<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Enviar Dinero</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="bg-primary min-vh-100 d-flex align-items-center justify-content-center p-3">
        <div class="card shadow-lg mx-auto" style="max-width: 500px; width: 100%;">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center font-weight-bold mb-4">Enviar Dinero</h2>

                <!-- Saldo -->
                <div class="bg-light p-3 mb-4 text-center rounded">
                    <small class="text-muted">Saldo actual</small>
                    <h4 class="font-weight-bold text-success mb-0" id="currentBalance">$5,250.00</h4>
                </div>

                <!-- Buscador -->
                <div class="form-group">
                    <label class="font-weight-bold">Buscar contacto</label>
                    <input type="text" class="form-control" id="searchContact" placeholder="Nombre o Alias...">
                </div>

                <!-- Lista de contactos -->
                <div id="contactList" class="mb-3" style="max-height: 200px; overflow-y: auto;"></div>

                <!-- Botón agregar contacto -->
                <button class="btn btn-outline-primary btn-block mb-3" data-toggle="modal" data-target="#addContactModal">
                    + Agregar nuevo contacto
                </button>

                <!-- Área de transferencia -->
                <div id="transferArea" class="d-none bg-light p-3 rounded">
                    <p class="mb-2">Enviar a: <strong id="transferTarget"></strong></p>
                    <div class="input-group mb-2">
                        <div class="input-group-prepend">
                            <span class="input-group-text">$</span>
                        </div>
                        <input type="number" class="form-control" id="transferAmount" placeholder="Monto" min="0.01" step="0.01">
                    </div>
                    <button class="btn btn-success btn-block" id="sendTransferBtn">Enviar</button>
                </div>

                <hr class="my-4">
                <button class="btn btn-outline-secondary btn-block" onclick="window.location.href='menu.html'">Volver al Menú</button>
            </div>
        </div>
    </div>

    <!-- Modal Agregar Contacto -->
    <div class="modal fade" id="addContactModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nuevo Contacto</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Nombre y apellido</label>
                        <input type="text" class="form-control" id="contactName" placeholder="Ej: Juan Pérez">
                    </div>
                    <div class="form-group">
                        <label>RUT</label>
                        <input type="text" class="form-control" id="contactCbu" placeholder="Ej: 123456789-0">
                    </div>
                    <div class="form-group">
                        <label>Alias</label>
                        <input type="text" class="form-control" id="contactAlias" placeholder="Ej: juan.perez">
                    </div>
                    <div class="form-group">
                        <label>Nombre del Banco</label>
                        <input type="text" class="form-control" id="contactBank" placeholder="Ej: Banco BCI">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="saveContactBtn">Guardar contacto</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 1. jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <!-- 2. Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <!-- 3. Bootstrap 4 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    <!-- 4. Tu JS -->
    <script src="assets/js/sendmoney.js"></script>
</body>
</html>
