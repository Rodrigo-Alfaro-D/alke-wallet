<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Depositar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="bg-primary min-vh-100 d-flex align-items-center justify-content-center p-3">
        <div class="card shadow-lg mx-auto" style="max-width: 420px; width: 100%;">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center font-weight-bold mb-4">Depositar</h2>

                <!-- Saldo -->
                <div class="bg-light p-3 mb-4 text-center rounded">
                    <small class="text-muted">Saldo actual</small>
                    <h4 class="font-weight-bold text-success mb-0" id="currentBalance">$5,250.00</h4>
                </div>

                <form id="depositForm">
                    <div class="form-group">
                        <label for="amount" class="font-weight-bold">Monto a depositar</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">$</span>
                            </div>
                            <input type="number" class="form-control form-control-lg" id="amount" placeholder="0.00" min="0.01" step="0.01" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success btn-block btn-lg">Realizar depósito</button>

                    <div id="successMessage" class="alert alert-success mt-3 d-none"></div>
                    <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>
                </form>

                <hr class="my-4">
                <button class="btn btn-outline-secondary btn-block" onclick="window.location.href='menu.html'">Volver al Menú</button>
            </div>
        </div>
    </div>

    <!-- 1. jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <!-- 2. Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <!-- 3. Bootstrap 4 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    <!-- 4. Tu JS -->
    <script src="assets/js/deposit.js"></script>
</body>
</html>
