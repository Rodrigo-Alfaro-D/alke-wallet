<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Depositar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="bg-primary min-vh-100 d-flex align-items-center justify-content-center p-3">
        <div class="card shadow-lg border-0 rounded-4" style="max-width: 420px; width: 100%;">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center fw-bold mb-4">Depositar</h2>

                <!-- Saldo -->
                <div class="bg-light rounded-3 p-3 mb-4 text-center">
                    <small class="text-muted">Saldo actual</small>
                    <h4 class="fw-bold text-success mb-0" id="currentBalance">$5,250.00</h4>
                </div>

                <form id="depositForm">
                    <div class="mb-4">
                        <label for="amount" class="form-label fw-bold">Monto a depositar</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control form-control-lg" id="amount" placeholder="0.00" min="0.01" step="0.01" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 btn-lg">Realizar depósito</button>

                    <!-- Mensajes -->
                    <div id="successMessage" class="alert alert-success mt-3 d-none"></div>
                    <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>
                </form>

                <hr class="my-4">
                <button class="btn btn-outline-secondary w-100" onclick="window.location.href='menu.html'">Volver al Menú</button>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS personalizado -->
    <script src="assets/js/deposit.js"></script>
</body>
</html>
