<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alke Wallet - Enviar dinero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- jQuery UI para autocomplete -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" />
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="menu.html">Alke Wallet</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="menu.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="deposit.html">Depositar</a></li>
                    <li class="nav-item"><a class="nav-link active" href="sendmoney.html">Enviar</a></li>
                    <li class="nav-item"><a class="nav-link" href="transactions.html">Movimientos</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Cerrar sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Enviar dinero</h2>
        <div class="row">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="sendMoneyForm">
                            <div class="mb-3">
                                <label for="contactSearch" class="form-label">Buscar contacto</label>
                                <input type="text" class="form-control" id="contactSearch" placeholder="Nombre o correo" />
                            </div>
                            <div class="mb-3">
                                <label for="sendAmount" class="form-label">Monto a enviar</label>
                                <input type="number" class="form-control" id="sendAmount" placeholder="0.00" min="0.01" step="0.01" required />
                            </div>
                            <div class="mb-3">
                                <label for="sendConcept" class="form-label">Concepto</label>
                                <input type="text" class="form-control" id="sendConcept" placeholder="Ej: Pago de servicios" />
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Enviar dinero</button>
                        </form>
                        <div id="sendMessage" class="mt-3"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5>Mis contactos</h5>
                        <ul id="contactList" class="list-group">
                            <li class="list-group-item">Ana Pérez - ana@mail.com</li>
                            <li class="list-group-item">Carlos Gómez - carlos@mail.com</li>
                            <li class="list-group-item">Laura Fernández - laura@mail.com</li>
                        </ul>
                        <button id="addContactBtn" class="btn btn-outline-secondary mt-3" data-bs-toggle="modal" data-bs-target="#addContactModal">Agregar nuevo contacto</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para agregar contacto -->
    <div class="modal fade" id="addContactModal" tabindex="-1" aria-labelledby="addContactModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addContactModalLabel">Agregar contacto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addContactForm">
                        <div class="mb-3">
                            <label for="newContactName" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="newContactName" required />
                        </div>
                        <div class="mb-3">
                            <label for="newContactEmail" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="newContactEmail" required />
                        </div>
                        <button type="submit" class="btn btn-success">Agregar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/sendmoney.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
