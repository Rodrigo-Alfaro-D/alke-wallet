<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alke Wallet - Menú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <!-- Navbar responsive -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Alke Wallet</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="menu.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="deposit.html">Depositar</a></li>
                    <li class="nav-item"><a class="nav-link" href="sendmoney.html">Enviar</a></li>
                    <li class="nav-item"><a class="nav-link" href="transactions.html">Movimientos</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Cerrar sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Tarjeta de resumen financiero -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Saldo disponible</h5>
                <h2 class="text-success" id="availableBalance">$0.00</h2>
                <p class="text-muted">Última actualización: <span id="lastUpdate">hoy</span></p>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card text-center shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Depositar</h5>
                        <p class="card-text">Añade fondos a tu cuenta</p>
                        <a href="deposit.html" class="btn btn-success">Ir a Depositar</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-center shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Enviar dinero</h5>
                        <p class="card-text">Transfiere a tus contactos</p>
                        <a href="sendmoney.html" class="btn btn-primary">Enviar</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card text-center shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Movimientos</h5>
                        <p class="card-text">Historial de transacciones</p>
                        <a href="transactions.html" class="btn btn-info">Ver historial</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery para animaciones y efectos -->
    <script>
        $(document).ready(function() {
            // Efecto de fadeIn en las tarjetas
            $('.card').hide().fadeIn(800);

            // Actualizar saldo desde localStorage
            let balance = localStorage.getItem('walletBalance') || '0.00';
            $('#availableBalance').text('$' + parseFloat(balance).toFixed(2));
            $('#lastUpdate').text(new Date().toLocaleString());
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
