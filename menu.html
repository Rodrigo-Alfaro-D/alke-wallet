<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Menú Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="bg-primary min-vh-100 d-flex align-items-center justify-content-center p-3">
        <div class="card shadow-lg border-0 rounded-4" style="max-width: 450px; width: 100%;">
            <div class="card-body p-4 p-md-5 text-center">
                <h2 class="fw-bold mb-4">Menú Principal</h2>

                <!-- Saldo -->
                <div class="bg-success text-white rounded-3 p-3 mb-4">
                    <small class="text-uppercase">Saldo disponible</small>
                    <h3 class="fw-bold mb-0" id="balanceDisplay">$5,250.00</h3>
                </div>

                <!-- Usuario -->
                <p class="text-muted small mb-4">
                    Usuario: <span id="userEmail">usuario@ejemplo.com</span>
                </p>

                <!-- Mensaje de redirección -->
                <div id="redirectMessage" class="alert alert-info d-none"></div>

                <!-- Botones -->
                <div class="d-grid gap-3">
                    <button class="btn btn-success btn-lg" id="btnDeposit">Depositar</button>
                    <button class="btn btn-primary btn-lg" id="btnSendMoney">Enviar Dinero</button>
                    <button class="btn btn-warning btn-lg text-white" id="btnTransactions">Últimos Movimientos</button>
                </div>

                <hr class="my-4">
                <button class="btn btn-outline-secondary w-100" id="btnLogout">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS personalizado -->
    <script src="assets/js/menu.js"></script>
</body>
</html>
