<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Menú Principal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="bg-primary min-vh-100 d-flex align-items-center justify-content-center p-3">
        <div class="card shadow-lg mx-auto" style="max-width: 450px; width: 100%;">
            <div class="card-body p-4 p-md-5 text-center">
                <h2 class="font-weight-bold mb-4">Menú Principal</h2>

                <!-- Saldo -->
                <div class="bg-success text-white p-3 mb-4 rounded">
                    <small class="text-uppercase">Saldo disponible</small>
                    <h3 class="font-weight-bold mb-0" id="balanceDisplay">$5,250.00</h3>
                </div>

                <!-- Usuario -->
                <p class="text-muted small mb-4">
                    Usuario: <span id="userEmail">usuario@ejemplo.com</span>
                </p>

                <!-- Mensaje de redirección -->
                <div id="redirectMessage" class="alert alert-info d-none"></div>

                <!-- Botones -->
                <div class="mb-3">
                    <button class="btn btn-success btn-lg btn-block mb-3" id="btnDeposit">Depositar</button>
                    <button class="btn btn-primary btn-lg btn-block mb-3" id="btnSendMoney">Enviar Dinero</button>
                    <button class="btn btn-warning btn-lg btn-block text-white mb-3" id="btnTransactions">Últimos Movimientos</button>
                </div>

                <hr class="my-4">

                <button class="btn btn-outline-secondary btn-block" id="btnLogout">Cerrar Sesión</button>
            </div>
        </div>
    </div>

    <!-- 1. jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <!-- 2. Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <!-- 3. Bootstrap 4 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    <!-- 4. Tu JS -->
    <script src="assets/js/menu.js"></script>
</body>
</html>
